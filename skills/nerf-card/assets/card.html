<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>{{title}}</title>
<style>
{{fonts}}
:root {
  --bg: #0b0d10; --t1: #f3f5f7; --t2: #a3acb6; --t3: #8a92a0;
  --hair: #ffffff14; --hair-2: #ffffff24; --glass: #181c21d6; --edge: #ffffff0f;
  --s: {{status}}; --s-ink: {{status_ink}};
  --display: 'Space Grotesk', system-ui, sans-serif;
  --sans: 'Geist', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
.card { position: relative; width: 1200px; height: 675px; overflow: hidden; padding: 40px 56px 32px; display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 20px; background: var(--bg); color: var(--t1);
  font: 400 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
/* The verdict's colour as light behind it, a cooler light from above, and hairline guides at the content edges. */
.card::before { content: ''; position: absolute; inset: 0; pointer-events: none; background:
  radial-gradient(620px 420px at 20% 38%, color-mix(in srgb, var(--s) 24%, transparent), transparent 72%),
  radial-gradient(900px 360px at 82% -12%, #62a4f51f, transparent 70%); }
.card::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(var(--hair), var(--hair)) 28px 0 / 1px 100% no-repeat,
  linear-gradient(var(--hair), var(--hair)) calc(100% - 28px) 0 / 1px 100% no-repeat; }
.card > * { position: relative; z-index: 1; min-width: 0; }
.mono { font: 500 11.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--t3); }

.top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 19px/1 var(--display); letter-spacing: -.02em; }
.brand svg { width: 20px; height: 20px; color: var(--s); }
.pill { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--hair-2); background: #1e2228eb; color: var(--t2);
  box-shadow: inset 0 1px 0 var(--edge); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 468px; gap: 36px; align-items: center; }
.say { display: flex; flex-direction: column; gap: 16px; }
.q { color: var(--t2); letter-spacing: .1em; font-size: 12.5px; }
.verdict { display: flex; align-items: center; gap: 20px; }
.badge { flex: none; width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; color: var(--s-ink);
  background: radial-gradient(circle at 32% 26%, color-mix(in srgb, var(--s) 62%, #fff), var(--s) 58%, color-mix(in srgb, var(--s) 78%, #000));
  box-shadow: inset 0 1.5px 0 #ffffff80, inset 0 -6px 14px #0000002e, 0 0 0 7px color-mix(in srgb, var(--s) 17%, transparent),
    0 18px 50px -8px color-mix(in srgb, var(--s) 75%, transparent); }
.badge svg { width: 50px; height: 50px; }
h1 { margin: 0; font: 700 {{verdict_px}}px/.92 var(--display); letter-spacing: -.045em; white-space: nowrap; color: #fff; }
.line { margin: 0; max-width: 31em; font-size: 19px; line-height: 1.5; color: var(--t2); text-wrap: pretty; }
.line b { color: var(--t1); font-weight: 600; }
.note { display: flex; flex-direction: column; gap: 5px; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--hair);
  background: #14171b99; max-width: 34em; }
.note p { margin: 0; font-size: 14.5px; line-height: 1.45; color: var(--t2); }
.note b { color: var(--t1); font-weight: 600; }

.panel { border-radius: 20px; border: 1px solid var(--hair); background: var(--glass); padding: 16px 18px 8px;
  box-shadow: inset 0 1px 0 var(--edge), 0 14px 36px -16px #000000b3; display: flex; flex-direction: column; gap: 6px; }
.panel svg { display: block; width: 100%; height: auto; }
.panel text { font-family: var(--mono); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { border-radius: 16px; border: 1px solid var(--hair); background: var(--glass); padding: 12px 16px 12px;
  box-shadow: inset 0 1px 0 var(--edge); display: flex; flex-direction: column; gap: 3px; }
.stat .v { font: 600 29px/1.1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat .v small { font: 500 14px/1 var(--sans); letter-spacing: 0; color: var(--t2); margin-left: 4px; }
.stat .s { font-size: 13px; line-height: 1.35; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.foot { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; font-size: 13px; color: var(--t3); }
.foot b { color: var(--t2); font-weight: 500; }
</style>
<div class="card" data-verdict="{{verdict_key}}">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 4-7 5 4"/></svg>
      <span>nerf check</span>
    </div>
    <div class="pill mono">{{pill}}</div>
  </div>

  <div class="main">
    <div class="say">
      <div class="q mono">{{question}}</div>
      <div class="verdict">
        <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"/></svg></div>
        <h1>{{verdict}}</h1>
      </div>
      <p class="line">{{line}}</p>
      {{note}}
    </div>
    <div class="panel">
      <div class="mono">{{chart_title}}</div>
      {{chart}}
    </div>
  </div>

  <div class="stats">{{stats}}</div>

  <div class="foot">
    <span>{{caveat}}</span>
    <span><b>nerf-check</b> by <b>Rig Labs</b> · github.com/rig-xyz/nerf-checker</span>
  </div>
</div>
</html>
