name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the floor the README promises (macOS still ships it as /usr/bin/python3). The newest runner image
          # has no 3.9 build, so that job stays on the last image that does.
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: End-to-end test on made-up transcripts
        run: python tests/test_pipeline.py
      - name: The nerf card on made-up weeks
        run: python tests/test_card.py
